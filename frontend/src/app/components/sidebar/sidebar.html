<section class="sidebar" aria-label="Chats">
  <header class="sidebar-header">
    <h2>Chats</h2>

    <button type="button" class="btn btn-primary new-chat-button" (click)="openNewChat()">
      <span class="new-chat-icon" aria-hidden="true">+</span>
      New Chat
    </button>
  </header>

  @if (showNewChat) {
    <section class="new-chat-panel" aria-label="Start a new chat">
      <div class="new-chat-panel-header">
        <div>
          <h3>Start a new chat</h3>
          <p>Choose someone to message.</p>
        </div>

        <button
          type="button"
          class="close-panel-button"
          aria-label="Close new chat panel"
          (click)="closeNewChat()"
        >
          &times;
        </button>
      </div>

      <div class="user-list">
        @for (user of users; track user.id) {
          <button type="button" class="user-option" (click)="createChat(user)">
            <span class="user-avatar" aria-hidden="true">
              {{ (user.display_name || user.username).charAt(0).toUpperCase() }}
            </span>
            <span class="user-name">{{ user.display_name || user.username }}</span>
          </button>
        } @empty {
          <p class="panel-empty-state">No users are available to start a chat.</p>
        }
      </div>
    </section>
  }

  <div class="conversation-list">
    @for (conversation of conversations; track conversation.id) {
      <button
        type="button"
        class="conversation-item"
        [class.active]="selectedConversationId === conversation.id"
        (click)="selectConversation(conversation)"
      >
        <span class="conversation-avatar" aria-hidden="true">
          {{ getConversationName(conversation).charAt(0).toUpperCase() }}
        </span>

        <span class="conversation-details">
          <span class="conversation-name">{{ getConversationName(conversation) }}</span>
          @if (conversation.conversation_type === 'PRIVATE') {
            <span class="conversation-type">Private conversation</span>
          } @else {
            <span class="conversation-type">Group conversation</span>
          }
        </span>

        @if (conversation.unread) {
          <span class="unread-badge">New</span>
        }
      </button>
    } @empty {
      <div class="empty-conversations">
        <span class="empty-conversations-icon" aria-hidden="true">&#9993;</span>
        <h3>No chats yet</h3>
        <p>Start a new chat to begin messaging.</p>
      </div>
    }
  </div>
</section>
