<div class="container mt-5" style="max-width: 400px;">

  <h2 class="mb-4">Login</h2>

  <form (ngSubmit)="login()">

    <div class="mb-3">
      <label class="form-label">Username</label>

      <input
        class="form-control"
        name="username"
        [(ngModel)]="username">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>

      <input
        type="password"
        class="form-control"
        name="password"
        [(ngModel)]="password">
    </div>

    <button
      type="submit"
      class="btn btn-primary w-100">
      Login
    </button>

  </form>

</div>
