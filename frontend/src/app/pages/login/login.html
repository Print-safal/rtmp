<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-heading">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">R</div>
      <span>RTMP</span>
    </div>

    <div class="auth-heading">
      <p>Welcome back</p>
      <h1 id="login-heading">Sign in to continue</h1>
      <span>Connect with your conversations.</span>
    </div>

    @if (errorMessage) {
      <div class="auth-alert auth-alert-error" role="alert">{{ errorMessage }}</div>
    }

    <form class="auth-form" (ngSubmit)="login()">
      <div class="auth-field">
        <label for="login-username">Username</label>
        <input id="login-username" class="form-control" type="text" name="username" [(ngModel)]="username" placeholder="Enter your username" autocomplete="username">
      </div>

      <div class="auth-field">
        <label for="login-password">Password</label>
        <input id="login-password" class="form-control" type="password" name="password" [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn auth-submit">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </section>
</main>
