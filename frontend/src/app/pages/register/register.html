<main class="auth-page">
  <section class="auth-card" aria-labelledby="register-heading">
    <div class="auth-brand">
      <div class="auth-logo" aria-hidden="true">R</div>
      <span>RTMP</span>
    </div>

    <div class="auth-heading">
      <p>Get started</p>
      <h1 id="register-heading">Create your account</h1>
      <span>Join RTMP and start the conversation.</span>
    </div>

    @if (errorMessage) { <div class="auth-alert auth-alert-error" role="alert">{{ errorMessage }}</div> }
    @if (successMessage) { <div class="auth-alert auth-alert-success" role="status">{{ successMessage }}</div> }

    <form class="auth-form" (ngSubmit)="register()">
      <div class="auth-field">
        <label for="register-username">Username</label>
        <input id="register-username" class="form-control" type="text" name="username" [(ngModel)]="username" placeholder="Choose a username" autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="register-email">Email</label>
        <input id="register-email" class="form-control" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="register-display-name">Display name</label>
        <input id="register-display-name" class="form-control" type="text" name="displayName" [(ngModel)]="displayName" placeholder="How people will see you" autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="register-password">Password</label>
        <input id="register-password" class="form-control" type="password" name="password" [(ngModel)]="password" placeholder="Minimum 8 characters" autocomplete="new-password">
      </div>

      <button type="submit" class="btn auth-submit">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Login</a></p>
  </section>
</main>
