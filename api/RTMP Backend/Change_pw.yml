info:
  name: Change_pw
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/change-password/"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
          "old_password": "password123",
          "new_password": "newpassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
