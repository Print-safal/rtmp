info:
  name: send Messages
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/messages/"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
          "conversation": 1,
          "content": "Hello from Bruno!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
